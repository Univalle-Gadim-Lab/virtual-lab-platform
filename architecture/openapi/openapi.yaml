openapi: 3.0.3
info:
  title: Virtual Lab Platform API
  description: |
    REST API for the Virtual Lab Platform, a modular monolith providing remote management
    and secure virtualization of computational resources through containers.

    The API covers user identity management, role-based authorization, virtual workspace
    instance lifecycle, resource metrics, and user-to-instance access control.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Users
    description: User identity management
  - name: User Roles
    description: User role assignment operations
  - name: Instances
    description: Virtual workspace instance lifecycle management
  - name: Instance Metrics
    description: Instance resource utilization metrics
  - name: Instance Users
    description: User-to-instance access control associations
  - name: Authentication
    description: JWT-based authentication and token management
  - name: Catalog
    description: Workspace catalog and image discovery
  - name: Remote Session
    description: Remote desktop session metadata and lifecycle
  - name: VNC
    description: KasmVNC HTTP and WebSocket proxy for browser-based remote desktop access
  - name: Health
    description: Application health check

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Application health check
      description: |
        Returns the current application health status.
        This endpoint is publicly accessible and does not require authentication.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Application is running and accepting requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and obtain tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User not found
        '409':
          description: User account is not active

  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange refresh token for new access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request payload
        '404':
          description: Refresh token not found
        '409':
          description: Refresh token revoked or expired

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Refresh token revoked successfully
        '404':
          description: Refresh token not found

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user identity and roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          description: Unauthorized - invalid or missing token

  /api/users:
    post:
      tags: [Users]
      summary: Create a new user
      description: |
        Creates a new user in the system.
        **Requires ADMIN role.**
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request payload
    get:
      tags: [Users]
      summary: List all users
      description: |
        Retrieves all users from the system.
        **Requires ADMIN role.**
      operationId: getAllUsers
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: |
        Retrieves a user by their unique identifier.
        **Requires ADMIN role.**
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    put:
      tags: [Users]
      summary: Update an existing user
      description: |
        Updates an existing user's mutable fields.
        **Requires ADMIN role.**
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Mark a user as deleted
      operationId: deleteUser
      description: |
        Soft-deletes a user by changing their status to DELETED.
        The user must currently be INACTIVE. The user record is retained for historical integrity.
        **Requires ADMIN role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User marked as deleted successfully
        '404':
          description: User not found
        '409':
          description: User is not in INACTIVE status

  /api/user-roles:
    post:
      tags: [User Roles]
      summary: Assign a single role to a user
      description: |
        Assigns a single role to the specified user.
        **Requires ADMIN role.**
      operationId: createUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRoleRequest'
      responses:
        '200':
          description: Role assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User not found
    get:
      tags: [User Roles]
      summary: Get roles for a user
      description: |
        Retrieves all roles assigned to the specified user.
        **Requires ADMIN role.**
      operationId: getRolesByUserId
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of roles for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponse'

  /api/user-roles/{id}:
    delete:
      tags: [User Roles]
      summary: Remove a role assignment
      description: |
        Removes a role assignment by its unique identifier.
        **Requires ADMIN role.**
      operationId: deleteUserRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role assignment removed successfully
        '404':
          description: Role assignment not found

  /api/user-roles/batch:
    post:
      tags: [User Roles]
      summary: Assign multiple roles to a user
      description: |
        Assigns multiple roles to the specified user in a single operation.
        **Requires ADMIN role.**
      operationId: createUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRolesRequest'
      responses:
        '200':
          description: Roles assigned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User not found

  /api/instances:
    post:
      tags: [Instances]
      summary: Create a new virtual workspace instance
      operationId: createInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '200':
          description: Instance created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '400':
          description: Invalid request payload
    get:
      tags: [Instances]
      summary: List instances for the current user
      operationId: getInstancesByUser
      responses:
        '200':
          description: List of instances belonging to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceResponse'

  /api/instances/{id}:
    get:
      tags: [Instances]
      summary: Get instance by ID
      operationId: getInstanceById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found
    delete:
      tags: [Instances]
      summary: Delete an instance
      operationId: deleteInstance
      description: |
        Soft-deletes an instance by changing its status to DELETED.
        The instance must currently be STOPPED. The instance record is retained for historical integrity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Instance deleted successfully
        '404':
          description: Instance not found
        '409':
          description: Instance is not in STOPPED status

  /api/instances/{id}/start:
    post:
      tags: [Instances]
      summary: Start an instance
      operationId: startInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found

  /api/instances/{id}/stop:
    post:
      tags: [Instances]
      summary: Stop an instance
      operationId: stopInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found

  /api/instances/{instanceId}/metrics:
    get:
      tags: [Instance Metrics]
      summary: Get metrics for an instance
      operationId: getMetricsByInstanceId
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of metrics snapshots for the instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceMetricsResponse'
        '404':
          description: Instance not found
    post:
      tags: [Instance Metrics]
      summary: Record new metrics for an instance
      operationId: recordMetrics
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMetricsRequest'
      responses:
        '200':
          description: Metrics recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceMetricsResponse'
        '400':
          description: Invalid request payload
        '404':
          description: Instance not found

  /api/instance-users:
    post:
      tags: [Instance Users]
      summary: Assign a user to an instance
      operationId: assignUserToInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceUserRequest'
      responses:
        '200':
          description: User assigned to instance successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUserResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User or instance not found
    get:
      tags: [Instance Users]
      summary: Get user-instance associations
      operationId: getInstanceUserAssociations
      description: |
        Returns user-instance associations filtered by query parameter.
        Exactly one of `instanceId` or `userId` must be provided.
      parameters:
        - name: instanceId
          in: query
          required: false
          schema:
            type: string
          description: Filter by instance ID (returns users for that instance)
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: Filter by user ID (returns instances for that user)
      responses:
        '200':
          description: List of user-instance associations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceUserResponse'
        '400':
          description: Missing or invalid query parameters
    delete:
      tags: [Instance Users]
      summary: Remove a user from an instance
      operationId: removeUserFromInstance
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: instanceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User removed from instance successfully
        '404':
          description: Association not found

  /api/catalog:
    get:
      tags: [Catalog]
      summary: Get the complete workspace catalog
      operationId: getCatalog
      description: |
        Returns the complete catalog of available workspace templates.
        Each entry includes the workspace image definition and the count of
        currently running (non-deleted) instances using that image.
        Available to all authenticated users.
      responses:
        '200':
          description: Workspace catalog with running instance counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogEntryResponse'

  /api/catalog/images:
    get:
      tags: [Catalog]
      summary: List available workspace images
      operationId: getAvailableImages
      description: |
        Returns the list of all configured workspace images with their
        metadata (name, description, version, category).
        Available to all authenticated users.
      responses:
        '200':
          description: List of available workspace images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceImageResponse'

  /api/instances/{instanceId}/remote-session:
    get:
      tags: [Remote Session]
      summary: Get remote desktop session for an instance
      operationId: getRemoteSession
      description: |
        Returns metadata about the remote desktop session for the specified
        instance, including its mapped status (PENDING / CONNECTING /
        ACTIVE / DISCONNECTED / TERMINATED), the VNC URL (host:port with
        per-instance password query parameter, only when the instance is
        running and VNC is enabled), and the session expiration timestamp.

        The caller must own the instance; otherwise the endpoint returns 403.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Remote session metadata retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteSessionResponse'
        '403':
          description: Caller does not own the instance
        '404':
          description: Instance not found
    delete:
      tags: [Remote Session]
      summary: Terminate the remote desktop session
      operationId: terminateRemoteSession
      description: |
        Terminates the active remote desktop session for the specified
        instance, stopping the underlying VNC server side channel.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Remote session terminated successfully
        '404':
          description: Instance not found

  /api/instances/{instanceId}/remote-session/status:
    get:
      tags: [Remote Session]
      summary: Check VNC server reachability for an instance
      operationId: getRemoteSessionStatus
      description: |
        Reports whether the KasmVNC server inside the running workspace
        container is reachable. Returns a small JSON payload with a
        human-readable status and a boolean flag.

        The caller must own the instance; otherwise the endpoint returns 403.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VNC reachability status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteSessionStatusResponse'
        '403':
          description: Caller does not own the instance
        '404':
          description: Instance not found

  # WebSocket upgrade endpoint for the KasmVNC proxy. OpenAPI 3.0.x has
  # no native WebSocket primitive; this operation documents the upgrade
  # endpoint as an HTTP GET, but the handler implemented in
  # `VncWebSocketProxyHandler` runs the WebSocket lifecycle (handshake,
  # binary/text frame forwarding, close) rather than a plain HTTP exchange.
  # See the operation `description` for the upgrade semantics, supported
  # close codes, and authentication flow. Declared before
  # `/vnc/{path}` so that the specific match takes precedence.
  /api/instances/{instanceId}/vnc/websockify:
    get:
      tags: [VNC]
      summary: WebSocket proxy to the instance's KasmVNC server
      operationId: proxyVncWebSocket
      description: |
        Establishes a `WebSocket` connection between the browser and the
        KasmVNC server running inside the target container on the
        dynamically bound host VNC port. The endpoint upgrades the
        incoming HTTP request via the standard `Upgrade: websocket`
        protocol exchange and bidirectionally forwards binary and text
        frames between the browser client and the container's KasmVNC
        server.

        Handlers implemented in `VncWebSocketProxyHandler` perform
        JWT-based authentication and instance ownership verification
        before establishing the upstream connection. The outbound
        connection uses HTTP Basic Auth (`labuser` + the per-instance
        VNC password) when reaching the container.

        Authentication may be supplied via:
        - the standard `Authorization: Bearer <jwt>` header, or
        - the `?token=<jwt>` query parameter (mirrored by the HTTP proxy
          endpoint into an HTTP-only `vnc_token` cookie), or
        - the `vnc_token` HTTP-only cookie set by the HTTP proxy endpoint.

        WebSocket close status codes used by the proxy:
        - `1000 Normal Closure` — clean disconnect by either side.
        - `4003 Forbidden` — caller does not own the instance.
        - `409 Conflict` — instance is not in `RUNNING` status.
        - `1011 Internal Error` — upstream KasmVNC server error.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: |
            Optional JWT, mirroring the same purpose as on the proxy HTTP
            endpoint. When not supplied, the JWT must be carried by the
            `Authorization` header or the `vnc_token` cookie set by the
            HTTP proxy endpoint.
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols — WebSocket handshake completed
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Caller does not own the instance
        '409':
          description: Instance is not in RUNNING status

  /api/instances/{instanceId}/vnc/{path}:
    get:
      tags: [VNC]
      summary: Proxy an HTTP request to the instance's KasmVNC web server
      operationId: proxyVncRequest
      description: |
        HTTP reverse proxy for KasmVNC web client assets served from the
        target container. The backend forwards `{path}` to the container's
        KasmVNC web server and streams the response (HTML, JavaScript, CSS)
        back to the caller, preserving status code and content type.

        For WebSocket upgrade requests, use the dedicated
        `/api/instances/{instanceId}/vnc/websockify` operation instead.

        Authentication may be supplied either as the standard
        `Authorization: Bearer <jwt>` header or, for iframe-friendly usage,
        via the `?token=<jwt>` query parameter. When `?token=` is present
        the JWT is mirrored back into an HTTP-only `vnc_token` cookie scoped
        to `/api/instances/{instanceId}/vnc` so subsequent XHRs and
        WebSocket upgrades can authenticate without re-passing the query
        parameter.

        The caller must own the instance (returns 403 if not) and the
        instance must be in `RUNNING` status (returns 409 otherwise).
        Upstream errors from the container are surfaced as 502.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: |
            Catch-all suffix forwarded verbatim to the KasmVNC web server
            (e.g. `""` for `/`, `index.html`, `client.js`, `kasmvnc.js`).
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: |
            Optional JWT used to authenticate iframe and WebSocket-typed
            requests that cannot easily attach the `Authorization` header.
            When supplied, the backend mirrors it into a `vnc_token`
            HTTP-only cookie so subsequent requests within the VNC scope
            authenticate transparently.
          schema:
            type: string
      responses:
        '200':
          description: Proxied response from the KasmVNC web server
          content:
            text/html:
              schema:
                type: string
              example: '<!doctype html><html>...</html>'
            application/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Caller does not own the instance
        '404':
          description: Instance not found
        '409':
          description: Instance is not in RUNNING status
        '502':
          description: Upstream KasmVNC web server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by the platform authentication service

  schemas:
    Role:
      type: string
      description: System authorization role
      enum:
        - ADMIN
        - STUDENT
        - TEACHER

    UserStatus:
      type: string
      description: User account lifecycle state
      enum:
        - ACTIVE
        - INACTIVE
        - DELETED

    InstanceStatus:
      type: string
      description: Virtual workspace instance lifecycle state
      enum:
        - CREATED
        - STARTING
        - RUNNING
        - STOPPED
        - EXPIRED
        - DELETED

    CreateUserRequest:
      type: object
      required:
        - id
        - name
        - lastName
        - password
        - status
      properties:
        id:
          type: string
          format: email
          description: Institutional email address used as the unique user identifier
        name:
          type: string
          description: User's first name
        lastName:
          type: string
        externalCode:
          type: string
          nullable: true
        password:
          type: string
          format: password
        status:
          $ref: '#/components/schemas/UserStatus'

    UpdateUserRequest:
      type: object
      description: |
        Request body for updating a user. All fields are optional.
        Only non-null fields will be applied. If password is provided,
        it will be re-encoded before persistence.
      properties:
        name:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        externalCode:
          type: string
          nullable: true
        password:
          type: string
          format: password
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: email
          description: Institutional email address (unique identifier)
        name:
          type: string
          description: User's first name
        lastName:
          type: string
        externalCode:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        createdDate:
          type: string
          format: date-time

    CreateUserRoleRequest:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    CreateUserRolesRequest:
      type: object
      required:
        - userId
        - roles
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    UserRoleResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    CreateInstanceRequest:
      type: object
      required:
        - name
        - imageName
        - imageVersion
        - imageRegistry
        - cpuCores
        - memoryMb
        - storageMb
        - gpuEnabled
        - exposedPort
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        imageName:
          type: string
        imageVersion:
          type: string
        imageRegistry:
          type: string
        cpuCores:
          type: integer
        memoryMb:
          type: integer
        storageMb:
          type: integer
        gpuEnabled:
          type: boolean
        exposedPort:
          type: integer

    InstanceResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        imageName:
          type: string
        imageVersion:
          type: string
        cpuCores:
          type: integer
        memoryMb:
          type: integer
        storageMb:
          type: integer
        gpuEnabled:
          type: boolean
        status:
          $ref: '#/components/schemas/InstanceStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true

    InstanceMetricsResponse:
      type: object
      properties:
        id:
          type: string
        instanceId:
          type: string
        currentCpuUsage:
          type: number
          format: double
        currentMemoryUsage:
          type: number
          format: double
        currentDiskUsage:
          type: number
          format: double
        currentTimeUsage:
          type: number
          format: double

    RecordMetricsRequest:
      type: object
      required:
        - cpuUsage
        - memoryUsage
        - diskUsage
        - timeUsage
      properties:
        cpuUsage:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Current CPU usage as a fraction (0.0 to 1.0)
        memoryUsage:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Current memory usage as a fraction (0.0 to 1.0)
        diskUsage:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Current disk usage as a fraction (0.0 to 1.0)
        timeUsage:
          type: number
          format: double
          minimum: 0.0
          description: Current time usage in seconds

    CreateInstanceUserRequest:
      type: object
      required:
        - userId
        - instanceId
      properties:
        userId:
          type: string
        instanceId:
          type: string

    InstanceUserResponse:
      type: object
      properties:
        id:
          type: string
        instanceId:
          type: string
        userId:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Institutional email address
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    AuthenticatedUserResponse:
      type: object
      properties:
        id:
          type: string
          format: email
          description: Institutional email address (unique identifier)
        name:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RemoteSessionStatus:
      type: string
      description: Human-readable status of the remote desktop session
      enum:
        - ACTIVE
        - CONNECTING
        - DISCONNECTED
        - PENDING
        - TERMINATED

    RemoteSessionResponse:
      type: object
      description: |
        Response payload returned by `GET /api/instances/{instanceId}/remote-session`.
        The `status` field maps the underlying `InstanceStatus` to the
        client-facing remote-session lifecycle (see `RemoteSessionStatus`).
        `vncUrl` is populated only when the instance is running and VNC is
        enabled; it carries the host, VNC host port and per-instance
        password query parameter that the KasmVNC web client expects.
      properties:
        instanceId:
          type: string
          description: Unique identifier of the owning instance
        status:
          $ref: '#/components/schemas/RemoteSessionStatus'
        vncEnabled:
          type: boolean
          description: Whether VNC remote desktop is enabled for the instance
        vncUrl:
          type: string
          nullable: true
          description: |
            Full KasmVNC client URL with embedded password query parameter
            (e.g. `http://localhost:6901?password=…`). Null when VNC is not
            enabled or when the instance is not in `RUNNING` status.
        expiresAt:
          type: string
          format: date-time
          description: Instance expiration timestamp copied from the domain model

    RemoteSessionStatusResponse:
      type: object
      description: |
        Response payload returned by
        `GET /api/instances/{instanceId}/remote-session/status`. Reports
        whether the KasmVNC server inside the workspace container is
        reachable over the host-bridged VNC port.
      properties:
        status:
          type: string
          description: Human-readable status (e.g. "UP", "DOWN", "STARTING")
        vncReachable:
          type: boolean
          description: True when the container's KasmVNC server responded to the reachability probe

    WorkspaceImageResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the workspace image
        name:
          type: string
          description: Human-readable display name
        description:
          type: string
          description: Brief description of the workspace purpose
        version:
          type: string
          description: Image version tag
        image:
          type: string
          description: Full Docker image reference (name:tag)
        category:
          type: string
          description: Grouping category (e.g. "EDA", "FPGA")

    CatalogEntryResponse:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/WorkspaceImageResponse'
        runningInstanceCount:
          type: integer
          format: int64
          description: Number of non-deleted instances currently using this image

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Application health status (e.g., "UP")
