openapi: 3.0.3
info:
  title: Virtual Lab Platform API
  description: |
    REST API for the Virtual Lab Platform, a modular monolith providing remote management
    and secure virtualization of computational resources through containers.

    The API covers user identity management, role-based authorization, virtual workspace
    instance lifecycle, resource metrics, and user-to-instance access control.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Users
    description: User identity management
  - name: User Roles
    description: User role assignment operations
  - name: Instances
    description: Virtual workspace instance lifecycle management
  - name: Instance Metrics
    description: Instance resource utilization metrics
  - name: Instance Users
    description: User-to-instance access control associations
  - name: Authentication
    description: JWT-based authentication and token management
  - name: Catalog
    description: Workspace catalog and image discovery

security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and obtain tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User not found
        '409':
          description: User account is not active

  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange refresh token for new access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request payload
        '404':
          description: Refresh token not found
        '409':
          description: Refresh token revoked or expired

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Refresh token revoked successfully
        '404':
          description: Refresh token not found

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user identity and roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          description: Unauthorized - invalid or missing token

  /api/users:
    post:
      tags: [Users]
      summary: Create a new user
      description: |
        Creates a new user in the system.
        **Requires ADMIN role.**
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request payload
    get:
      tags: [Users]
      summary: List all users
      description: |
        Retrieves all users from the system.
        **Requires ADMIN role.**
      operationId: getAllUsers
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: |
        Retrieves a user by their unique identifier.
        **Requires ADMIN role.**
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    put:
      tags: [Users]
      summary: Update an existing user
      description: |
        Updates an existing user's mutable fields.
        **Requires ADMIN role.**
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Mark a user as deleted
      operationId: deleteUser
      description: |
        Soft-deletes a user by changing their status to DELETED.
        The user must currently be INACTIVE. The user record is retained for historical integrity.
        **Requires ADMIN role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User marked as deleted successfully
        '404':
          description: User not found
        '409':
          description: User is not in INACTIVE status

  /api/users/by-username:
    get:
      tags: [Users]
      summary: Get user by username
      description: |
        Retrieves a user by their username.
        **Requires ADMIN role.**
      operationId: getUserByUsername
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found

  /api/user-roles:
    post:
      tags: [User Roles]
      summary: Assign a single role to a user
      description: |
        Assigns a single role to the specified user.
        **Requires ADMIN role.**
      operationId: createUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRoleRequest'
      responses:
        '200':
          description: Role assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User not found
    get:
      tags: [User Roles]
      summary: Get roles for a user
      description: |
        Retrieves all roles assigned to the specified user.
        **Requires ADMIN role.**
      operationId: getRolesByUserId
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of roles for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponse'

  /api/user-roles/{id}:
    delete:
      tags: [User Roles]
      summary: Remove a role assignment
      description: |
        Removes a role assignment by its unique identifier.
        **Requires ADMIN role.**
      operationId: deleteUserRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role assignment removed successfully
        '404':
          description: Role assignment not found

  /api/user-roles/batch:
    post:
      tags: [User Roles]
      summary: Assign multiple roles to a user
      description: |
        Assigns multiple roles to the specified user in a single operation.
        **Requires ADMIN role.**
      operationId: createUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRolesRequest'
      responses:
        '200':
          description: Roles assigned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User not found

  /api/instances:
    post:
      tags: [Instances]
      summary: Create a new virtual workspace instance
      operationId: createInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '200':
          description: Instance created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '400':
          description: Invalid request payload
    get:
      tags: [Instances]
      summary: List instances for the current user
      operationId: getInstancesByUser
      responses:
        '200':
          description: List of instances belonging to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceResponse'

  /api/instances/{id}:
    get:
      tags: [Instances]
      summary: Get instance by ID
      operationId: getInstanceById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found
    delete:
      tags: [Instances]
      summary: Delete an instance
      operationId: deleteInstance
      description: |
        Soft-deletes an instance by changing its status to DELETED.
        The instance must currently be STOPPED. The instance record is retained for historical integrity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Instance deleted successfully
        '404':
          description: Instance not found
        '409':
          description: Instance is not in STOPPED status

  /api/instances/{id}/start:
    post:
      tags: [Instances]
      summary: Start an instance
      operationId: startInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found

  /api/instances/{id}/stop:
    post:
      tags: [Instances]
      summary: Stop an instance
      operationId: stopInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found

  /api/instances/{instanceId}/metrics:
    get:
      tags: [Instance Metrics]
      summary: Get metrics for an instance
      operationId: getMetricsByInstanceId
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of metrics snapshots for the instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceMetricsResponse'
        '404':
          description: Instance not found
    post:
      tags: [Instance Metrics]
      summary: Record new metrics for an instance
      operationId: recordMetrics
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMetricsRequest'
      responses:
        '200':
          description: Metrics recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceMetricsResponse'
        '400':
          description: Invalid request payload
        '404':
          description: Instance not found

  /api/instance-users:
    post:
      tags: [Instance Users]
      summary: Assign a user to an instance
      operationId: assignUserToInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceUserRequest'
      responses:
        '200':
          description: User assigned to instance successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUserResponse'
        '400':
          description: Invalid request payload
        '404':
          description: User or instance not found
    get:
      tags: [Instance Users]
      summary: Get user-instance associations
      operationId: getInstanceUserAssociations
      description: |
        Returns user-instance associations filtered by query parameter.
        Exactly one of `instanceId` or `userId` must be provided.
      parameters:
        - name: instanceId
          in: query
          required: false
          schema:
            type: string
          description: Filter by instance ID (returns users for that instance)
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: Filter by user ID (returns instances for that user)
      responses:
        '200':
          description: List of user-instance associations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceUserResponse'
        '400':
          description: Missing or invalid query parameters
    delete:
      tags: [Instance Users]
      summary: Remove a user from an instance
      operationId: removeUserFromInstance
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: instanceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User removed from instance successfully
        '404':
          description: Association not found

  /api/catalog:
    get:
      tags: [Catalog]
      summary: Get the complete workspace catalog
      operationId: getCatalog
      description: |
        Returns the complete catalog of available workspace templates.
        Each entry includes the workspace image definition and the count of
        currently running (non-deleted) instances using that image.
        Available to all authenticated users.
      responses:
        '200':
          description: Workspace catalog with running instance counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogEntryResponse'

  /api/catalog/images:
    get:
      tags: [Catalog]
      summary: List available workspace images
      operationId: getAvailableImages
      description: |
        Returns the list of all configured workspace images with their
        metadata (name, description, version, category).
        Available to all authenticated users.
      responses:
        '200':
          description: List of available workspace images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceImageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by the platform authentication service

  schemas:
    Role:
      type: string
      description: System authorization role
      enum:
        - ADMIN
        - STUDENT
        - TEACHER

    UserStatus:
      type: string
      description: User account lifecycle state
      enum:
        - ACTIVE
        - INACTIVE
        - DELETED

    InstanceStatus:
      type: string
      description: Virtual workspace instance lifecycle state
      enum:
        - CREATED
        - STARTING
        - RUNNING
        - STOPPED
        - EXPIRED
        - DELETED

    CreateUserRequest:
      type: object
      required:
        - name
        - lastName
        - password
        - status
      properties:
        name:
          type: string
        lastName:
          type: string
        externalCode:
          type: string
          nullable: true
        password:
          type: string
          format: password
        status:
          $ref: '#/components/schemas/UserStatus'

    UpdateUserRequest:
      type: object
      description: |
        Request body for updating a user. All fields are optional.
        Only non-null fields will be applied. If password is provided,
        it will be re-encoded before persistence.
      properties:
        name:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        externalCode:
          type: string
          nullable: true
        password:
          type: string
          format: password
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'

    UserResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lastName:
          type: string
        externalCode:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        createdDate:
          type: string
          format: date-time

    CreateUserRoleRequest:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    CreateUserRolesRequest:
      type: object
      required:
        - userId
        - roles
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    UserRoleResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    CreateInstanceRequest:
      type: object
      required:
        - name
        - imageName
        - imageVersion
        - imageRegistry
        - cpuCores
        - memoryMb
        - storageMb
        - gpuEnabled
        - exposedPort
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        imageName:
          type: string
        imageVersion:
          type: string
        imageRegistry:
          type: string
        cpuCores:
          type: integer
        memoryMb:
          type: integer
        storageMb:
          type: integer
        gpuEnabled:
          type: boolean
        exposedPort:
          type: integer

    InstanceResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        imageName:
          type: string
        imageVersion:
          type: string
        cpuCores:
          type: integer
        memoryMb:
          type: integer
        storageMb:
          type: integer
        gpuEnabled:
          type: boolean
        status:
          $ref: '#/components/schemas/InstanceStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true

    InstanceMetricsResponse:
      type: object
      properties:
        id:
          type: string
        instanceId:
          type: string
        currentCpuUsage:
          type: number
          format: double
        currentMemoryUsage:
          type: number
          format: double
        currentDiskUsage:
          type: number
          format: double
        currentTimeUsage:
          type: number
          format: double

    RecordMetricsRequest:
      type: object
      required:
        - cpuUsage
        - memoryUsage
        - diskUsage
        - timeUsage
      properties:
        cpuUsage:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Current CPU usage as a fraction (0.0 to 1.0)
        memoryUsage:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Current memory usage as a fraction (0.0 to 1.0)
        diskUsage:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Current disk usage as a fraction (0.0 to 1.0)
        timeUsage:
          type: number
          format: double
          minimum: 0.0
          description: Current time usage in seconds

    CreateInstanceUserRequest:
      type: object
      required:
        - userId
        - instanceId
      properties:
        userId:
          type: string
        instanceId:
          type: string

    InstanceUserResponse:
      type: object
      properties:
        id:
          type: string
        instanceId:
          type: string
        userId:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    AuthenticatedUserResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    WorkspaceImageResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the workspace image
        name:
          type: string
          description: Human-readable display name
        description:
          type: string
          description: Brief description of the workspace purpose
        version:
          type: string
          description: Image version tag
        image:
          type: string
          description: Full Docker image reference (name:tag)
        category:
          type: string
          description: Grouping category (e.g. "EDA", "FPGA")

    CatalogEntryResponse:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/WorkspaceImageResponse'
        runningInstanceCount:
          type: integer
          format: int64
          description: Number of non-deleted instances currently using this image
